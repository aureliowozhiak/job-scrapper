version: '3.8'

services:
  # Web API com scraper e loader integrados
  api:
    build:
      context: .
      target: development
    container_name: job-scrapper-api
    ports:
      - "5000:5000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Persistent volumes for data
      - ./lake:/app/lake
      - ./output:/app/output
      - ./logs:/app/logs
      - ./jobs.db:/app/jobs.db
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    networks:
      - scrapper-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  scrapper-network:
    driver: bridge

volumes:
  lake:
  output:
  logs:
  database:


