services:
  # Redis - Job Queue Backend
  redis:
    image: redis:7-alpine
    container_name: sherlock-jobs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sherlock-jobs-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sherlock-jobs-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=sqlite:///./data/db/jobs.db
      - DEBUG=false
      - ENABLE_BACKGROUND_JOBS=true
      - RELOAD=true
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sherlock-jobs-network
    restart: unless-stopped

  # RQ Worker - Background Job Processor
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sherlock-jobs-worker
    command: python worker.py
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=sqlite:///./data/db/jobs.db
    volumes:
      - .:/app
      - ./data:/app/data
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f worker.py || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sherlock-jobs-network
    restart: unless-stopped

  # RQ Dashboard (Optional - for monitoring jobs)
  rq-dashboard:
    image: eoranged/rq-dashboard
    container_name: sherlock-jobs-dashboard
    ports:
      - "9181:9181"
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9181" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sherlock-jobs-network
    restart: unless-stopped

networks:
  sherlock-jobs-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
